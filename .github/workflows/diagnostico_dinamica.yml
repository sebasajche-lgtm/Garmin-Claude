name: Diagnóstico dinámica de carrera (temporal)

on:
  workflow_dispatch:
    inputs:
      fecha:
        description: "Fecha a revisar (YYYY-MM-DD). Vacío = ayer."
        required: false
        default: ""

jobs:
  diagnostico:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - env:
          GARMIN_EMAIL: ${{ secrets.GARMIN_EMAIL }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
        run: python diagnostico_dinamica.py ${{ inputs.fecha }}
