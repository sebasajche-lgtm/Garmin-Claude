name: Sincronizar datos de Garmin a Google Drive

on:
  schedule:
    - cron: "0 14 * * *"
  workflow_dispatch:
    inputs:
      fecha_inicio:
        description: "Fecha inicio (YYYY-MM-DD). Dejar vacío para correr solo ayer."
        required: false
        default: ""
      fecha_fin:
        description: "Fecha fin (YYYY-MM-DD). Dejar vacío si solo pusiste fecha_inicio."
        required: false
        default: ""

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Ejecutar sincronización
        env:
          GARMIN_EMAIL: ${{ secrets.GARMIN_EMAIL }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: python garmin_to_drive.py ${{ inputs.fecha_inicio }} ${{ inputs.fecha_fin }}

      - name: Descargar historial actualizado
        env:
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: python descargar_historial.py

      - name: Generar dashboard
        run: python generar_dashboard.py garmin_historial_local.csv plan_oct-dic_2026_sesiones.csv

      - name: Guardar dashboard.html en el repositorio (historial)
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add dashboard.html
          git diff --staged --quiet || git commit -m "Actualizar dashboard automaticamente"
          git push
        continue-on-error: true

      - name: Preparar carpeta a publicar
        run: |
          mkdir -p _site
          cp dashboard.html _site/index.html
          cp chart.umd.js _site/chart.umd.js

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
