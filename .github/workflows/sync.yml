name: Sincronizar datos de Garmin a Google Drive

on:
  schedule:
    # Corre todos los días a las 14:00 UTC (08:00 hora de Guatemala).
    # Cambiá el número si querés otra hora: es formato "minuto hora * * *" en UTC.
    # Guatemala está 6 horas detrás de UTC (no cambia con horario de verano).
    - cron: "0 14 * * *"
  workflow_dispatch:  # permite correrlo manualmente desde GitHub cuando quieras
    inputs:
      fecha_inicio:
        description: "Fecha inicio (YYYY-MM-DD). Dejar vacío para correr solo hoy."
        required: false
        default: ""
      fecha_fin:
        description: "Fecha fin (YYYY-MM-DD). Dejar vacío si solo pusiste fecha_inicio (un solo día)."
        required: false
        default: ""

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Ejecutar sincronización
        env:
          GARMIN_EMAIL: ${{ secrets.GARMIN_EMAIL }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: python garmin_to_drive.py ${{ inputs.fecha_inicio }} ${{ inputs.fecha_fin }}
